# SQ-InstructBLIP Questioner fraction training config.
model:
  arch: blip2_vicuna_instruct
  model_type: vicuna7b
  load_finetuned: True
  finetuned: "/model/InstructBLIP/instruct_blip_vicuna7b_trimmed.pth"
  llm_model: "/model/lmsys/vicuna-7b-v1.1"
  use_grad_checkpoint: True
  freeze_vit: True
  role: Questioner

datasets:
  vqa_introspect_qar_caption:
    data_type: images
    prompt_type: Questioner_MultipleSubQ
    sample_fraction: 1.0
    sample_seed: 42
    eval_max_samples: null
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
      eval:
        name: "blip_image_eval"
        image_size: 224
    text_processor:
      train:
        name: "blip_question"
      eval:
        name: "blip_question"

run:
  task: vqa_introspect_captioning
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 16000
  weight_decay: 0.05
  max_epoch: 10
  batch_size_train: 8
  batch_size_eval: 1
  num_workers: 0
  accum_grad_iters: 16
  prompt: "{}"
  max_len: 128
  min_len: 1
  num_beams: 5
  seed: 42
  output_dir: "ywjang_output_sq_fraction/questioner_full"
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]
  device: "cuda"
  world_size: 4
  dist_url: "env://"
  distributed: True
