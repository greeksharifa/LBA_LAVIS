runner:
  visualize: false
  sub_mode: subqa
  select_high_confidence: false
  examplar: default
  threshold_lba: false
  vision_supple: false
  use_pre_generated_sub_q: true
  use_pre_generated_sub_a: false
  num_sub_qa_generate: 1
  num_sub_qa_select: 1
  num_frame_sampling: 3
  recomposer_name: Salesforce/blip2-flan-t5-xl
  decomposer_name: self
  answerer_name: Salesforce/blip2-flan-t5-xl
  HF_HOME: /model/
  device_map: cuda:0
  qwen_prompt: false
  batch_size: 32
  seed: 44
  output_dir: output/
  print_freq: 20
  use_vqa_tool: false
  num_bin: 20
  num_heatmap_row: 10
  debug: false
  sevila_cfg_pkl_path: SeViLA/cfg.pkl
  flipped_vqa_cfg_pkl_path: flipped_vqa/cfg.pkl
datasets:
  dataset_name: VQA_Introspect
  root_dir: /data/
  num_data: -1
  split: val
  data_type: images
  vqa_acc: true
  ann_paths:
    train:
    - VQA_Introspect/VQAIntrospect_trainv1.0.json
    - VQA/v2/v2_mscoco_train2014_annotations.json
    val:
    - VQA_Introspect/VQAIntrospect_valv1.0.json
    - VQA/v2/v2_mscoco_val2014_annotations.json
    - /data/VQA_Introspect/sub_qas_val_xl_fewshot_vqaintrospect_unique.json
  vis_root: coco/images/
model:
  cache_dir: /model/
dataset_name: VQA_Introspect
num_data: -1
