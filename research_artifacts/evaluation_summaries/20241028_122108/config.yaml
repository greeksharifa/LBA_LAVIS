  decomposer_name: self
  answerer_name: Salesforce/blip2-flan-t5-xl
  HF_HOME: /model/
  device_map: cuda:0
  qwen_prompt: false
  batch_size: 1
  seed: 44
  output_dir: output/
  print_freq: 20
  use_vqa_tool: false
  num_bin: 20
  num_heatmap_row: 10
  debug: false
  sevila_cfg_pkl_path: SeViLA/cfg.pkl
  flipped_vqa_cfg_pkl_path: flipped_vqa/cfg.pkl
datasets:
  dataset_name: NExTQA
  root_dir: /data/
  num_data: -1
  split: val
  data_type: videos
  n_frms: 4
  vqa_acc: false
  ann_paths:
    train:
    - NExT_QA/sevila_style/train.json
    val:
    - NExT_QA/sevila_style/val.json
    - /data/NExT_QA/sub_qas_val_16F_fewshot_vqaintrospect_unique.json
  vis_root: NExT_QA/NExTVideo/
model:
  cache_dir: /model/
dataset_name: NExTQA
num_data: -1
