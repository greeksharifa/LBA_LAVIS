runner:
  visualize: false
  sub_mode: subqa
  select_high_confidence: true
  examplar: none
  threshold_lba: false
  vision_supple: false
  use_pre_generated_sub_q: true
  use_pre_generated_sub_a: true
  num_sub_qa_generate: 5
  num_sub_qa_select: 2
  num_frame_sampling: 3
  recomposer_name: Salesforce/blip2-flan-t5-xl
  decomposer_name: self
  answerer_name: Salesforce/blip2-flan-t5-xl
  HF_HOME: /model/
  device_map: cuda
  qwen_prompt: false
  batch_size: 12
  seed: 44
  output_dir: output/
  print_freq: 20
  use_vqa_tool: false
  num_bin: 20
  num_heatmap_row: 10
  debug: false
  sevila_cfg_pkl_path: SeViLA/cfg.pkl
  flipped_vqa_cfg_pkl_path: flipped_vqa/cfg.pkl
datasets:
  dataset_name: ActivityNetQA
  root_dir: /data/
  num_data: -1
  split: val
  data_type: videos
  n_frms: 8
  vqa_acc: false
  open_ended: true
  ann_paths:
    train:
    - ActivityNetQA/activitynet-qa/dataset/train_q.json
    - ActivityNetQA/activitynet-qa/dataset/train_a.json
    val:
    - ActivityNetQA/activitynet-qa/dataset/val_q.json
    - ActivityNetQA/activitynet-qa/dataset/val_a.json
    - /data/ActivityNetQA/sub_qas_val_xl_fewshot_vqaintrospect_unique.json
  vis_root: ActivityNetQA/video/
model:
  cache_dir: /model/
dataset_name: ActivityNetQA
n_frms: 8
num_data: -1
