  sevila_cfg_pkl_path: SeViLA/cfg.pkl
  flipped_vqa_cfg_pkl_path: flipped_vqa/cfg.pkl
datasets:
  dataset_name: SLAKE
  root_dir: /data/
  num_data: -1
  split: val
  data_type: images
  vqa_acc: false
  ann_paths:
    train:
    - Slake1.0/train.json
    val:
    - Slake1.0/validate.json
    - Slake1.0/sub_qas_val_xl_fewshot_vqaintrospect_unique.json
    test:
    - Slake1.0/test.json
  vis_root: Slake1.0/imgs/
model:
  cache_dir: /model/
dataset_name: SLAKE
num_data: -1
