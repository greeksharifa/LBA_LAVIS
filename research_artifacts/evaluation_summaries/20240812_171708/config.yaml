runner:
  visualize: false
  match1ok: true
  select_high_confidence: false
  train_recomposer_examplar: true
  random_frame: false
  threshold_lba: false
  recomposer_name: Salesforce/blip2-flan-t5-xl
  decomposer_name: self
  answerer_name: Salesforce/blip2-flan-t5-xl
  HF_HOME: /data2/
  device_map: cuda:0
  batch_size: 12
  num_sub_qa_generate: 1
  num_sub_qa_select: 1
  output_dir: output/
  print_freq: 50
  use_vqa_tool: false
  num_bin: 50
  debug: false
  cfg_pkl_path: SeViLA/cfg.pkl
datasets:
  dataset_name: VLEP
  num_data: 20
  split: val
  supple_n: 3
  data_type: videos
  n_frms: 4
  vqa_acc: false
  ann_paths:
    train:
    - /data1/VLEP/sevila_style/train.json
    val:
    - /data1/VLEP/sevila_style/val.json
  vis_root: /data1/VLEP/vlep_frames/
  vis_processor:
    train:
      name: blip_video_eval
      n_frms: 4
      image_size: 224
      min_scale: 0.9
      max_scale: 1.0
    eval:
      name: blip_video_eval
      n_frms: 4
      image_size: 224
      min_scale: 0.9
      max_scale: 1.0
  text_processor:
    train:
      name: blip_question
    eval:
      name: blip_caption
model:
  cache_dir: /data2/
dataset_name: VLEP
num_data: 20
