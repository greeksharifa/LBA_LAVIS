runner:
  visualize: false
  sub_mode: subqa
  select_high_confidence: true
  examplar: default
  threshold_lba: false
  vision_supple: false
  use_pre_generated_sub_q: true
  use_pre_generated_sub_a: true
  num_sub_qa_generate: 5
  num_sub_qa_select: 2
  num_frame_sampling: 3
  recomposer_name: llava-hf/llava-v1.6-mistral-7b-hf
  decomposer_name: self
  answerer_name: Salesforce/blip2-flan-t5-xl
  HF_HOME: /model/
  device_map: cuda
  qwen_prompt: false
  max_new_tokens_subq: 100
  max_new_tokens_suba: 100
  max_new_tokens_maina: 256
  batch_size: 3
  seed: 44
  output_dir: output/
  print_freq: 20
  use_vqa_tool: false
  num_bin: 20
  num_heatmap_row: 10
  debug: false
  sevila_cfg_pkl_path: SeViLA/cfg.pkl
  flipped_vqa_cfg_pkl_path: flipped_vqa/cfg.pkl
  model_tag: 16F
datasets:
  dataset_name: MSVDQA
  root_dir: /data/
  num_data: 1000
  split: val
  data_type: videos
  n_frms: 4
  vqa_acc: false
  open_ended: true
  ann_paths:
    train:
    - MSVDQA/qa/train_qa.json
    - MSVDQA/youtube_mapping.txt
    val:
    - MSVDQA/qa/val_qa.json
    - MSVDQA/youtube_mapping.txt
    - /data/MSVDQA/sub_qas_val_16F_fewshot_vqaintrospect_unique.json
  vis_root: MSVDQA/YouTubeClips/
model:
  cache_dir: /model/
dataset_name: MSVDQA
num_data: 1000
