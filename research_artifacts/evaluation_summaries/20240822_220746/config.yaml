runner:
  visualize: false
  sub_mode: subqa
  select_high_confidence: true
  train_recomposer_examplar: true
  threshold_lba: false
  vision_supple: true
  num_sub_qa_generate: 1
  num_sub_qa_select: 1
  num_frame_sampling: 3
  recomposer_name: sevila
  decomposer_name: self
  answerer_name: Salesforce/blip2-flan-t5-xl
  HF_HOME: /data2/
  device_map: cuda:0
  batch_size: 4
  seed: 44
  output_dir: output/
  print_freq: 50
  use_vqa_tool: false
  num_bin: 50
  num_heatmap_row: 10
  debug: false
  cfg_pkl_path: SeViLA/cfg.pkl
  random_frame: false
datasets:
  dataset_name: DramaQA
  root_dir: /data1/
  num_data: -1
  split: val
  data_type: videos
  n_frms: 32
  vqa_acc: false
  only_scene: false
  ann_paths:
    train:
    - AnotherMissOh/AnotherMissOhQA_train_set.json
    - flipped_vqa/dramaqa/clipvitl14.pth
    val:
    - AnotherMissOh/AnotherMissOhQA_val_set.json
    - flipped_vqa/dramaqa/clipvitl14.pth
  vis_root: AnotherMissOh/images/
  vis_processor:
    train:
      name: alpro_video_train
      n_frms: 5
      image_size: 224
      min_scale: 0.9
      max_scale: 1.0
    eval:
      name: alpro_video_eval
      n_frms: 5
      image_size: 224
      min_scale: 0.9
      max_scale: 1.0
  text_processor:
    train:
      name: blip_question
    eval:
      name: blip_caption
model:
  cache_dir: /data2/
dataset_name: DramaQA
num_data: -1
n_frms: 32
