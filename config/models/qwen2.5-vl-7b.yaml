model:
  model_name: qwen2.5-vl-7b
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  subqa_model_name: qwen2.5-vl-7b
  model_type: huggingface # [huggingface|openai]
  needs_video_metadata: False

  # cache_dir: /model/Qwen/
  # device_map: "auto"
