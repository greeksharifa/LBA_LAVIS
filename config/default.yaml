runner:
  # context     : "subqa"   # [subqa, default]
  mode        : "dummy" # [multi_stage, subq, suba, base, refined]
  subqa_mode  : "self"    # [self, GT, irrSubQ, wrongSubA, QC_K, QC_C, QC_Q] | question category: [Knowledge, C, Question]
  visualize_only: False

  CoT_path    : 5 # number of CoT paths
  llm_judge_mode: "subq" # [subq, suba, subqa]
  few_shot    : "" # [subq, base, refined] | divide by comma. example: "subq,refined"

  # confidence
  confidence_type: "token_min_prob" # "token_min_prob", "seq_ppl", "seq_conf"

  N           : 4 # number of sub-qas to generate
  M           : 2 # number of curated sub-qas
  K           : 4 # number of reasoning paths
  early_stop_K: True # if confidence is high enough, early stop 

  subqa_depth: 1
  branching_by_depth: null
  suba_M: 2
  suba_K: 3
  suba_confidence_type: token_min_prob
  condition_on_direct_suba: true
  subqa_max_nodes: 64
  subqa_repair_attempts: 1
  subqa_generation_batch_size: 64
  subqa_schema_version: 2

  seed: 42
  start_pnt: -1 # -1 or 0 to 100. -1: all. 0: all, but do not collect results. else: start from percent%
  end_pnt: 100

  # output and logging
  output_dir  : output/
  subqa_dir   : subqa/
  print_freq  : 20
  logging_level: INFO # DEBUG, INFO, WARNING, ERROR, CRITICAL


dataset:
  dataset_name: "dummy_dataset_name" # [NExTQA, ...]
  root_dir: /data/
  num_data:
    val: 500
    test: 2000
  split: test # [val, test]

  api:
    api_key_path: api_key.json
    

model:
  HF_HOME: /model/
  
  device_map: "auto" # ["auto", "cuda", 0, ...]

  fps: 1
  min_n_frms: 1

  # vllm
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.95
  swap_space: 16
  max_model_len: 16384
  enforce_eager: true

  max_num_seqs: 256
  max_tokens: 1024
  temperature: 0.0
  sampling_n: 1
