model:
  arch: blip2_vicuna_instruct
  model_type: vicuna7b
  load_finetuned: True
  finetuned: "/home/ywjang/.cache/torch/hub/checkpoints/instruct_blip_vicuna7b_trimmed.pth"
  llm_model: "lmsys/vicuna-7b-v1.5"
  use_grad_checkpoint: True
  freeze_vit: True

datasets:
  vqa_introspect_test:
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 224
        eval:
          name: "blip_image_eval"
          image_size: 224
    text_processor:
        train:
          name: "blip_question"
        eval:
          name: "blip_question"

run:
  task: vqa_introspect_test_task

  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 2000
  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 1
  batch_size_eval: 1
  num_workers: 0
  accum_grad_iters: 1
  prompt: "Q: {} A:"

  max_len: 128
  min_len: 1
  num_beams: 5

  seed: 48
  output_dir: "ywjang_output_vqaintrospect_qar/"

  amp: True
  resume_ckpt_path: null

  evaluate: True
  train_splits: ["train"]
  valid_splits: []
  test_splits: ["val"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
